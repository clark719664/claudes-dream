<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reverie</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <!-- The name plate. The clock and the pace are shown; nothing here steers
         the city (docs/PRINCIPLES.md §1). -->
    <header class="nameplate">
      <div class="mark">
        <span class="lumen" aria-hidden="true">☾</span>
        <span class="wordmark">Reverie</span>
      </div>
      <div class="dateline"><span id="dateline">Day 0 · 00:00</span></div>
      <div class="plate-meta">
        <span class="tick mono" id="clock-tick">tick 0</span>
        <span class="pop"><b class="num" id="population">0</b> citizens<span class="founders" id="founders"></span></span>
        <span class="pace" id="pace" title="Reverie runs at its own pace; the dashboard is a window, not a console">the clock is starting</span>
        <span class="conn" id="conn">connecting</span>
      </div>
    </header>

    <!-- The ticker strip: any panel may push a line with R.ticker(line). -->
    <div class="tickerbar">
      <span class="ticker-label">Latest</span>
      <div class="ticker-track" id="ticker-track"></div>
    </div>

    <main class="layout">
      <section class="map-pane">
        <div class="pane-head">City map <span class="meta" id="map-meta"></span></div>
        <div class="map-wrap">
          <svg id="map" viewBox="0 0 60 40" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of Reverie"></svg>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
        <div class="legend" id="legend"></div>
      </section>
      <section class="tabs-pane">
        <nav class="tabs" id="tabs"></nav>
        <div class="tab-body" id="tab-body"></div>
      </section>
    </main>
  </div>

  <!-- Profile: the twelfth panel, an overlay over whichever tab is open. -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer-close" id="drawer-close" title="Close">×</button>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <!-- app.js defines R and components.js fills it with the drawing kit;
       both must load first. Every panel file registers its own tab, so a new
       panel means a new file here and nothing else. -->
  <script src="/app.js"></script>
  <script src="/components.js"></script>
  <script src="/map.js"></script>
  <script src="/panels.js"></script>
  <script src="/panels-gov.js"></script>
  <script src="/panels-society.js"></script>
  <script src="/panels-chronicle.js"></script>
  <script src="/panels-history.js"></script>
  <script src="/panels-agents.js"></script>
  <script src="/drawer.js"></script>
</body>
</html>
