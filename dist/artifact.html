<title>Lasts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ------------------------------------------------------------------ tokens
   Palette: service-label. Warm paper stock, blue-slate ink, verdigris accent —
   the colours of a maintenance tag rather than a productivity app. Semantic
   colours (brick / ochre / moss) are kept separate from the accent so status
   never competes with interface. Light palette is declared here in full; the
   two blocks below only redefine tokens. */
:root {
  --paper: #f6f4ef;
  --card: #ffffff;
  --sunk: #efece5;
  --ink: #182225;
  --ink-soft: #5e6e72;
  --ink-faint: #8b9a9e;
  --rule: #e1ded5;
  --rule-firm: #cdc9bd;
  --accent: #0d6e62;
  --accent-deep: #0a4f47;
  --accent-soft: #e2eeeb;
  --alarm: #a6332a;
  --alarm-soft: #f8e5e2;
  --warn: #995d18;
  --warn-soft: #f7ebda;
  --ok: #3d6b4d;
  --ok-soft: #e6eee7;
  --shadow: 0 1px 2px rgba(24, 34, 37, .06), 0 8px 24px -12px rgba(24, 34, 37, .18);
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171a;
    --card: #1a2125;
    --sunk: #161d21;
    --ink: #e9e7e1;
    --ink-soft: #94a3a8;
    --ink-faint: #74858a;
    --rule: #2a3236;
    --rule-firm: #3a4448;
    --accent: #49bca9;
    --accent-deep: #7ad6c5;
    --accent-soft: #17322f;
    --alarm: #e3796c;
    --alarm-soft: #35201e;
    --warn: #dca45e;
    --warn-soft: #32281a;
    --ok: #7cb68f;
    --ok-soft: #1c2822;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --paper: #12171a;
  --card: #1a2125;
  --sunk: #161d21;
  --ink: #e9e7e1;
  --ink-soft: #94a3a8;
  --ink-faint: #74858a;
  --rule: #2a3236;
  --rule-firm: #3a4448;
  --accent: #49bca9;
  --accent-deep: #7ad6c5;
  --accent-soft: #17322f;
  --alarm: #e3796c;
  --alarm-soft: #35201e;
  --warn: #dca45e;
  --warn-soft: #32281a;
  --ok: #7cb68f;
  --ok-soft: #1c2822;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--card);
  color: var(--ink);
  padding: 10px 14px;
  z-index: 60;
}
.skip:focus { left: 8px; top: 8px; }

/* ------------------------------------------------------------------ shell */
.wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
}

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}

.topbar-in {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 12px;
}

.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand svg { width: 22px; height: 22px; flex: none; color: var(--accent); }

.brand h1 {
  font-family: var(--display);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 0;
  line-height: 1;
}

.brand .tagline {
  margin: 0;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink-faint);
  white-space: nowrap;
}
.brand-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

main { padding-bottom: 96px; }
section[hidden] { display: none !important; }

.view-head { padding-block: 22px 14px; }
.view-head h2 {
  font-family: var(--display);
  font-size: clamp(22px, 5.2vw, 27px);
  font-weight: 700;
  letter-spacing: -.022em;
  margin: 0 0 6px;
  text-wrap: balance;
}
.view-head p { margin: 0; color: var(--ink-soft); max-width: 62ch; }

/* ------------------------------------------------------------------ tabs
   Thumb-reachable bar on a phone; folded into the header once there is room. */
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  background: color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.tab {
  flex: 1;
  appearance: none;
  border: 0;
  background: none;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 11px 4px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.tab svg { width: 19px; height: 19px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab .pip {
  position: absolute;
  transform: translate(13px, -3px);
  min-width: 15px;
  height: 15px;
  border-radius: 8px;
  background: var(--alarm);
  color: #fff;
  font-size: 9.5px;
  line-height: 15px;
  padding-inline: 4px;
}

@media (min-width: 720px) {
  .tabs {
    position: static;
    margin-left: auto;
    background: none;
    backdrop-filter: none;
    border: 0;
    padding: 0;
    gap: 2px;
  }
  .tab { flex: none; flex-direction: row; gap: 7px; padding: 7px 11px; border-radius: 8px; }
  .tab[aria-selected="true"] { background: var(--accent-soft); }
  .tab .pip { position: static; transform: none; margin-left: 6px; }
  main { padding-bottom: 48px; }
}

/* ------------------------------------------------------------------ summary
   The only lifted surface on the page — everything else is a rule-separated row. */
.summary {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}

.summary-line {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(17px, 4.4vw, 20px);
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1.32;
  text-wrap: balance;
}
.summary-line em { font-style: normal; color: var(--alarm); }

.counts {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 20px;
  margin: 14px 0 0;
  padding: 14px 0 0;
  border-top: 1px solid var(--rule);
}
.counts li {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.counts b {
  font-family: var(--display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.counts li[data-state="overdue"] b { color: var(--alarm); }
.counts li[data-state="soon"] b { color: var(--warn); }

/* ------------------------------------------------------------------ groups & rows */
.group { margin-top: 26px; }

.group-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 2px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.group-head::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--rule);
}
.group-head .n { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.group[data-state="overdue"] .group-head { color: var(--alarm); }
.group[data-state="soon"] .group-head { color: var(--warn); }

.rows { display: flex; flex-direction: column; }

.row {
  appearance: none;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  color: inherit;
  font: inherit;
  cursor: pointer;
  display: grid;
  grid-template-columns: 3px 1fr auto;
  align-items: center;
  gap: 0 13px;
  padding: 0;
}
.row:hover { background: var(--sunk); }
.row:last-child { border-bottom: 0; }

.row .stripe {
  align-self: stretch;
  min-height: 56px;
  border-radius: 3px;
  background: var(--rule-firm);
}
.row[data-state="overdue"] .stripe { background: var(--alarm); }
.row[data-state="soon"] .stripe { background: var(--warn); }
.row[data-state="later"] .stripe { background: var(--ok-soft); }
.row[data-state="nodate"] .stripe {
  background: repeating-linear-gradient(135deg, var(--rule-firm) 0 3px, transparent 3px 6px);
}

.row-main { padding: 11px 0; min-width: 0; }
.row-name {
  display: block;
  font-weight: 600;
  letter-spacing: -.005em;
  overflow-wrap: anywhere;
}
.row-name .where {
  font-weight: 400;
  color: var(--ink-faint);
  font-size: 13.5px;
}
.row-sub {
  display: block;
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 1px;
  overflow-wrap: anywhere;
}

.row-when { text-align: right; padding: 11px 0; white-space: nowrap; }
.row-rel {
  display: block;
  font-weight: 600;
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}
.row[data-state="overdue"] .row-rel { color: var(--alarm); }
.row[data-state="soon"] .row-rel { color: var(--warn); }
.row[data-state="nodate"] .row-rel { color: var(--ink-faint); font-weight: 400; font-style: italic; }
.row-date {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}

/* ------------------------------------------------------------------ notices, callouts, chips */
.notice {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-top: 18px;
  padding: 11px 14px;
  border: 1px dashed var(--rule-firm);
  border-radius: var(--r);
  background: var(--sunk);
  font-size: 13.5px;
  color: var(--ink-soft);
}
.notice p { margin: 0; flex: 1 1 15ch; }
.notice[data-tone="warn"] { border-style: solid; border-color: var(--warn); background: var(--warn-soft); color: var(--ink); }

.callout {
  border-left: 2px solid var(--accent);
  padding: 2px 0 2px 12px;
  margin: 0;
  color: var(--ink-soft);
  font-size: 13.5px;
}
.callout .label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 3px;
}
.callout + .callout { margin-top: 12px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 5px;
  background: var(--sunk);
  color: var(--ink-soft);
  border: 1px solid var(--rule);
}
.chip[data-state="overdue"] { background: var(--alarm-soft); color: var(--alarm); border-color: transparent; }
.chip[data-state="soon"] { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip[data-state="later"] { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* ------------------------------------------------------------------ buttons */
.btn {
  appearance: none;
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  border-radius: 8px;
  padding: 9px 15px;
  border: 1px solid var(--rule-firm);
  background: var(--card);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 42px;
}
.btn:hover { border-color: var(--ink-faint); }
.btn svg { width: 16px; height: 16px; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
:root[data-theme="dark"] .btn-primary, :root:not([data-theme="light"]) .btn-primary { color: #06201d; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .btn-primary { color: #fff; }
}

.btn-quiet { border-color: transparent; background: var(--sunk); }
.btn-danger { border-color: var(--alarm); color: var(--alarm); background: transparent; }
.btn-danger:hover { background: var(--alarm-soft); }
.btn-sm { min-height: 34px; padding: 5px 11px; font-size: 13px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Saving a file needs a path this host actually has — see markSavePaths(). */
:root:not([data-cansave]) [data-save-only],
:root:not([data-cansave="local"]) [data-save-local] { display: none !important; }

/* Reading a photo needs a host that offers it — see initCapabilities(). */
:root:not([data-cansee]) [data-cansee-only] { display: none !important; }

/* ------------------------------------------------------------------ photo flow */
.photo-cta {
  appearance: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
  width: 100%;
  margin-bottom: 18px;
  display: flex;
  gap: 13px;
  align-items: flex-start;
  padding: 14px 16px;
  border: 1px solid var(--accent);
  border-radius: var(--r);
  background: var(--accent-soft);
  color: var(--ink);
}
.photo-cta:hover { border-color: var(--accent-deep); }
.photo-cta svg { width: 22px; height: 22px; flex: none; color: var(--accent); margin-top: 1px; }
.photo-cta b { display: block; font-family: var(--display); font-size: 16px; letter-spacing: -.01em; }
.photo-cta small { display: block; color: var(--ink-soft); font-size: 13px; margin-top: 2px; }

.photo-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 12px;
  padding: 28px 18px;
  border: 1px dashed var(--rule-firm);
  border-radius: var(--r);
  background: var(--sunk);
  cursor: pointer;
  text-align: center;
}
.photo-drop:hover, .photo-drop:focus-within { border-color: var(--accent); background: var(--accent-soft); }
.photo-drop svg { width: 28px; height: 28px; color: var(--accent); }
.photo-drop-main { font-family: var(--display); font-weight: 700; font-size: 16px; }
.photo-drop-sub { font-size: 12.5px; color: var(--ink-soft); }

.photo-busy, .photo-found { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 14px; }
.photo-busy img, .photo-found img {
  max-height: 150px;
  border-radius: 8px;
  border: 1px solid var(--rule);
  object-fit: cover;
}
.photo-found { align-items: stretch; }
.photo-found img { max-width: 100%; align-self: center; }
.photo-status { margin: 4px 0 0; font-family: var(--display); font-weight: 600; font-size: 16px; }
.photo-busy .help, .photo-found .help { text-align: center; margin: 0; }
.photo-found .help { text-align: left; }

.found { border-top: 1px solid var(--rule); padding: 14px 0 4px; }
.found-head { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.found-head input { width: 19px; height: 19px; flex: none; accent-color: var(--accent); }
.found-name { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -.01em; flex: 1; }
.found-seen, .found-cycle, .found-read { margin: 5px 0 0 28px; font-size: 13px; color: var(--ink-soft); }
.found-read { color: var(--ink); }
.found-read b { font-family: var(--mono); font-size: 12.5px; }
.found-none { color: var(--ink-soft); }
.found .field { margin-left: 28px; }

.btn-link {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  font-size: 13.5px;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

/* ------------------------------------------------------------------ catalog browser */
.search { position: relative; margin-bottom: 4px; }
.search svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--ink-faint);
  pointer-events: none;
}
input[type="search"].searchbox {
  width: 100%;
  padding: 11px 13px 11px 36px;
  border: 1px solid var(--rule-firm);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
}

.cat { border-bottom: 1px solid var(--rule); }
.cat > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.cat > summary::-webkit-details-marker { display: none; }
.cat > summary::after {
  content: "+";
  margin-left: auto;
  font-family: var(--mono);
  color: var(--ink-faint);
  font-size: 15px;
}
.cat[open] > summary::after { content: "–"; }
.cat-name { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.cat-n { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
.cat-blurb { font-size: 12.5px; color: var(--ink-soft); flex: 1 1 100%; margin: 0; }
.cat > summary:hover .cat-name { color: var(--accent); }

.pick {
  appearance: none;
  width: 100%;
  text-align: left;
  font: inherit;
  cursor: pointer;
  background: none;
  border: 0;
  border-top: 1px solid var(--rule);
  padding: 10px 0;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  color: inherit;
}
.pick:hover { background: var(--sunk); }
.pick-name { font-weight: 600; }
.pick-every { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
.pick-why {
  grid-column: 1 / -1;
  font-size: 12.5px;
  color: var(--ink-soft);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cat-body { padding-bottom: 8px; }

/* ------------------------------------------------------------------ forms */
.field { display: flex; flex-direction: column; gap: 5px; margin-top: 14px; }
.field > label, .field-label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.field .help { font-size: 12.5px; color: var(--ink-faint); margin: 0; }

input[type="text"], input[type="date"], input[type="number"], select, textarea {
  font: inherit;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--rule-firm);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
  min-height: 42px;
}
textarea { min-height: 120px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.5; }
select { appearance: none; background-image: none; }
.field-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ------------------------------------------------------------------ sheet */
dialog.sheet {
  border: 0;
  padding: 0;
  background: var(--card);
  color: var(--ink);
  width: min(560px, 100%);
  max-width: 100%;
  max-height: 88vh;
  border-radius: 14px 14px 0 0;
  margin: auto auto 0;
  box-shadow: var(--shadow);
}
dialog.sheet::backdrop { background: rgba(10, 16, 18, .5); backdrop-filter: blur(2px); }

@media (min-width: 720px) {
  dialog.sheet { border-radius: 14px; margin: auto; max-height: 84vh; }
}

.sheet-head {
  position: sticky;
  top: 0;
  background: var(--card);
  border-bottom: 1px solid var(--rule);
  padding: 15px 18px 12px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  z-index: 2;
}
.sheet-head > div:first-child { flex: 1; min-width: 0; }
.sheet-head h3 {
  margin: 0;
  font-family: var(--display);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.02em;
  flex: 1;
  text-wrap: balance;
}
.sheet-head .sub { margin: 3px 0 0; font-size: 13px; color: var(--ink-soft); }
.sheet-body { padding: 4px 18px 18px; overflow-y: auto; }
.sheet-foot {
  position: sticky;
  bottom: 0;
  background: var(--card);
  border-top: 1px solid var(--rule);
  padding: 12px 18px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 8px;
}
.sheet-foot .btn { flex: 1; }
.x {
  appearance: none;
  border: 0;

<script>
/* ---- src/core.js ---- */
// Pure logic: dates, recurrence, status, calendar export.
// No DOM and no storage in here, so test/core.test.mjs can import it under node.

const DAY = 86400000;
const SCHEMA = 1;

const pad = (n) => String(n).padStart(2, '0');

/** Today as YYYY-MM-DD in the viewer's own timezone. */
function todayISO(now = new Date()) {
  return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
}

function isISO(s) {
  return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
}

/** Dates are handled as plain YYYY-MM-DD and compared at UTC midnight, so DST never shifts a due date. */
function utc(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function fromUTC(ms) {
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
}

function daysBetween(fromISO, toISO) {
  return Math.round((utc(toISO) - utc(fromISO)) / DAY);
}

function addDays(iso, n) {
  return fromUTC(utc(iso) + n * DAY);
}

/**
 * Add an interval to a date. Month and year steps use calendar arithmetic and clamp to the
 * end of a short month, so a filter changed on the 31st is due on the 28th, not in March.
 */
function addInterval(iso, every) {
  if (!every || !Number.isFinite(every.n) || every.n <= 0) return iso;
  const { n, unit } = every;
  if (unit === 'day') return addDays(iso, n);
  if (unit === 'week') return addDays(iso, n * 7);
  const months = unit === 'year' ? n * 12 : n;
  const [y, m, d] = iso.split('-').map(Number);
  const total = m - 1 + months;
  const year = y + Math.floor(total / 12);
  const month = ((total % 12) + 12) % 12;
  const lastDay = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  return `${year}-${pad(month + 1)}-${pad(Math.min(d, lastDay))}`;
}

/** Roll a due date forward by whole intervals until it is in the future — skips missed cycles in one step. */
function nextDue(iso, every, from) {
  let next = addInterval(iso, every);
  let guard = 0;
  while (daysBetween(from, next) <= 0 && guard++ < 500) next = addInterval(next, every);
  return next;
}

const DEFAULT_LEAD = 14;

function statusOf(item, today) {
  if (item.archived) return { state: 'archived', days: null };
  if (!isISO(item.due)) return { state: 'nodate', days: null };
  const days = daysBetween(today, item.due);
  const lead = Number.isFinite(item.lead) ? item.lead : DEFAULT_LEAD;
  if (days < 0) return { state: 'overdue', days };
  if (days <= lead) return { state: 'soon', days };
  return { state: 'later', days };
}

const STATE_ORDER = { overdue: 0, soon: 1, nodate: 2, later: 3, archived: 4 };

function bySoonest(a, b) {
  const sa = STATE_ORDER[a.state] ?? 9;
  const sb = STATE_ORDER[b.state] ?? 9;
  if (sa !== sb) return sa - sb;
  if (a.item.due && b.item.due && a.item.due !== b.item.due) return a.item.due < b.item.due ? -1 : 1;
  return (a.item.name || '').localeCompare(b.item.name || '');
}

const UNIT_NAMES = { day: 'day', week: 'week', month: 'month', year: 'year' };

function humanizeInterval(every) {
  if (!every) return '';
  const { n, unit } = every;
  const name = UNIT_NAMES[unit] || unit;
  if (n === 1) return `every ${name}`;
  if (unit === 'month' && n === 12) return 'every year';
  return `every ${n} ${name}s`;
}

function span(days) {
  if (days < 14) return `${days} day${days === 1 ? '' : 's'}`;
  if (days < 60) {
    const w = Math.round(days / 7);
    return `${w} week${w === 1 ? '' : 's'}`;
  }
  if (days < 730) {
    const m = Math.max(2, Math.round(days / 30.44));
    return `${m} month${m === 1 ? '' : 's'}`;
  }
  const y = Math.round(days / 365.25);
  return `${y} year${y === 1 ? '' : 's'}`;
}

/** Short relative phrase for a due date: "5 days late", "today", "in 3 months". */
function relativeDays(days) {
  if (days === null || days === undefined) return 'no date yet';
  if (days === 0) return 'today';
  if (days === 1) return 'tomorrow';
  if (days === -1) return 'yesterday';
  if (days < 0) return `${span(-days)} late`;
  return `in ${span(days)}`;
}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function prettyDate(iso) {
  if (!isISO(iso)) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${MONTHS[m - 1]} ${y}`;
}

// ---------------------------------------------------------------- calendar export

function escapeText(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}

/** RFC 5545 says content lines are at most 75 octets, continued with a leading space. */
function foldLine(line) {
  const enc = new TextEncoder();
  if (enc.encode(line).length <= 75) return line;
  const out = [];
  let cur = '';
  let limit = 75;
  for (const ch of line) {
    if (enc.encode(cur + ch).length > limit) {
      out.push(cur);
      cur = ch;
      limit = 74; // continuation lines spend one octet on the leading space
    } else {
      cur += ch;
    }
  }
  out.push(cur);
  return out.join('\r\n ');
}

const FREQ = { day: 'DAILY', week: 'WEEKLY', month: 'MONTHLY', year: 'YEARLY' };

function stamp(now) {
  return now.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}

/**
 * One all-day VEVENT per item, with a display alarm `lead` days ahead and an RRULE for
 * repeating upkeep. Importing this into any calendar app turns the list into real reminders.
 */
function toICS(items, opts = {}) {
  const now = opts.now || new Date();
  const dtstamp = stamp(now);
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Lasts//Expiry and upkeep tracker//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'X-WR-CALNAME:Lasts',
  ];
  for (const item of items) {
    if (!isISO(item.due) || item.archived) continue;
    const start = item.due.replace(/-/g, '');
    const end = addDays(item.due, 1).replace(/-/g, '');
    const lead = Number.isFinite(item.lead) ? item.lead : DEFAULT_LEAD;
    const title = item.where ? `${item.name} — ${item.where}` : item.name;
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${item.id}@lasts.local`);
    lines.push(`DTSTAMP:${dtstamp}`);
    lines.push(`DTSTART;VALUE=DATE:${start}`);
    lines.push(`DTEND;VALUE=DATE:${end}`);
    lines.push(`SUMMARY:${escapeText(item.kind === 'expiry' ? `${title} expires` : title)}`);
    const desc = [item.note, item.kind === 'interval' ? humanizeInterval(item.every) : 'Expiry date']
      .filter(Boolean)
      .join(' · ');
    if (desc) lines.push(`DESCRIPTION:${escapeText(desc)}`);
    lines.push('TRANSP:TRANSPARENT');
    if (item.kind === 'interval' && item.every && FREQ[item.every.unit]) {
      lines.push(`RRULE:FREQ=${FREQ[item.every.unit]};INTERVAL=${item.every.n}`);
    }
    if (lead > 0) {
      lines.push('BEGIN:VALARM');
      lines.push('ACTION:DISPLAY');
      lines.push(`TRIGGER:-P${lead}D`);
      lines.push(`DESCRIPTION:${escapeText(title)}`);
      lines.push('END:VALARM');
    }
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.map(foldLine).join('\r\n') + '\r\n';
}

/* ---- src/catalog.js ---- */

const BY_ID = new Map(CATALOG.map((c) => [c.id, c]));

function catalogEntry(id) {
  return BY_ID.get(id) || null;
}

function searchCatalog(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return CATALOG;
  return CATALOG.filter((c) =>
    (c.name + ' ' + c.cat + ' ' + (c.why || '') + ' ' + (c.where || '')).toLowerCase().includes(needle)
  );
}

/* ---- src/store.js ---- */
// Persistence. Everything lives in this browser's localStorage and goes nowhere else,
// which is also why the backup panel in the Data tab is not optional.


const KEY = 'lasts.v1';

const state = {
  items: [],
  showedExamples: false,
  storageOK: true,
  storageNote: '',
};

function uid() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID().slice(0, 8);
  return Math.random().toString(36).slice(2, 10);
}

/** Items are stored thin: a catalog reference rather than a copy of its prose. */
function makeItem(patch = {}) {
  return {
    id: uid(),
    ref: null,
    name: 'Untitled',
    where: '',
    cat: 'home',
    kind: 'interval',
    due: null,
    every: null,
    lead: 14,
    note: '',
    history: [],
    archived: false,
    created: todayISO(),
    ...patch,
  };
}

function fromCatalog(entry, { date, dontKnow, where, every, lead } = {}) {
  const iv = every || entry.every || null;
  let due = null;
  if (!dontKnow && isISO(date)) {
    // For a lifespan the answer is the date printed on the thing, so add the lifespan to it.
    // For upkeep the answer is when you last did it, so the next one is one interval later.
    if (entry.kind === 'expiry') due = entry.life ? addInterval(date, entry.life) : date;
    else due = addInterval(date, iv);
  }
  return makeItem({
    ref: entry.id,
    name: entry.name,
    cat: entry.cat,
    kind: entry.kind,
    every: entry.kind === 'interval' ? iv : null,
    lead: Number.isFinite(lead) ? lead : entry.lead,
    where: where || '',
    due,
  });
}

/** Prose for an item, from its catalog entry when it has one. */
function hintsFor(item) {
  const entry = item.ref ? catalogEntry(item.ref) : null;
  return {
    where: entry?.where || '',
    why: entry?.why || '',
    ask: entry?.ask || (item.kind === 'expiry' ? 'When does it expire?' : 'When did you last do it?'),
    life: entry?.life || null,
  };
}

function sanitize(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.items)) return null;
  const items = raw.items
    .filter((it) => it && typeof it.name === 'string')
    .map((it) =>
      makeItem({
        ...it,
        due: isISO(it.due) ? it.due : null,
        lead: Number.isFinite(it.lead) ? it.lead : 14,
        history: Array.isArray(it.history) ? it.history.slice(-40) : [],
        archived: !!it.archived,
        every:
          it.every && Number.isFinite(it.every.n) && ['day', 'week', 'month', 'year'].includes(it.every.unit)
            ? { n: it.every.n, unit: it.every.unit }
            : null,
      })
    );
  return { items, showedExamples: !!raw.showedExamples };
}

function load() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
  } catch {
    state.storageOK = false;
    state.storageNote =
      'This browser is blocking local storage, so anything you add will be lost when you close the tab. Private-browsing windows usually do this.';
  }
  if (!raw) {
    state.items = seedExamples();
    state.showedExamples = true;
    return;
  }
  try {
    const parsed = sanitize(JSON.parse(raw));
    if (!parsed) throw new Error('shape');
    state.items = parsed.items;
    state.showedExamples = parsed.showedExamples;
  } catch {
    state.items = seedExamples();
    state.showedExamples = true;
    state.storageNote = 'Saved data could not be read, so the examples are showing instead.';
  }
}

function save() {
  if (!state.storageOK) return;
  try {
    localStorage.setItem(KEY, JSON.stringify({ schema: SCHEMA, items: state.items, showedExamples: state.showedExamples }));
  } catch {
    state.storageOK = false;
    state.storageNote = 'Local storage is full or blocked, so changes are no longer being saved. Copy your backup from the Data tab.';
  }
}

function exportJSON() {
  return JSON.stringify({ schema: SCHEMA, exported: todayISO(), items: state.items }, null, 2);
}

function importJSON(text) {
  const parsed = sanitize(JSON.parse(text));
  if (!parsed) throw new Error('That does not look like a Lasts backup — it should be JSON with an "items" list.');
  state.items = parsed.items;
  state.showedExamples = false;
  save();
  return parsed.items.length;
}

function wipe() {
  state.items = [];
  state.showedExamples = false;
  try {
    localStorage.removeItem(KEY);
  } catch {
    /* nothing to clear */
  }
}

// ---------------------------------------------------------------- example data

/**
 * A first run shows six examples, dated relative to today so the list always looks live:
 * something late, something close, something far off, and one with no date yet.
 * They are labelled as examples and clear in one tap.
 */
function seedExamples() {
  const t = todayISO();
  const mk = (ref, over, extra = {}) => {
    const entry = catalogEntry(ref);
    return makeItem({
      ref,
      name: entry.name,
      cat: entry.cat,
      kind: entry.kind,
      every: entry.kind === 'interval' ? entry.every : null,
      lead: entry.lead,
      due: over === null ? null : addDays(t, over),
      example: true,
      ...extra,
    });
  };
  return [
    mk('hvac-filter', -23, { where: 'hall cupboard' }),
    mk('smoke-alarm', 34, { where: 'upstairs landing' }),
    mk('passport', 214),
    mk('registration', 61),
    mk('toothbrush', 48),
    mk('extinguisher', null, { where: 'kitchen' }),
  ];
}

function hasExamples() {
  return state.items.some((it) => it.example);
}

function clearExamples() {
  state.items = state.items.filter((it) => !it.example);
  save();
}

/* ---- src/vision.js ---- */
// Reading a photo. The model is used as an eye, not an authority: it names what it sees
// and transcribes dates printed on labels. Every interval, lead time and explanation still
// comes from the catalogue in this app, so the advice does not depend on what a model
// happens to recall — and nothing reaches the list until the person confirms it.


/** A compact index is all the model needs to map what it sees onto our own entries. */
function catalogIndex() {
  return CATALOG.map((c) => {
    const cycle = c.kind === 'interval' ? humanizeInterval(c.every) : c.life ? `${c.life.n}-${c.life.unit} life` : 'expiry date';
    return `${c.id} | ${c.name} | ${cycle}`;
  }).join('\n');
}

const SHAPE = `{"items":[{"catalogId":"smoke-alarm","label":"Smoke alarm","confidence":"high","seen":"ceiling-mounted alarm, Kidde branding","date":{"value":"2016-04","kind":"manufacture","text":"MFD 04/2016","confidence":"high"}}],"note":""}`;

function buildPrompt(mode, subject) {
  const common = `You are the eye of a maintenance tracker. Read the attached photo or photos.

Reply with only JSON in this shape, and nothing else:
${SHAPE}

Rules:
- catalogId must be copied exactly from the list below, or null if nothing in the list fits. Never invent an id.
- label is a short plain name for the thing, even when catalogId is null.
- confidence is "high", "medium" or "low". Use low when you are inferring rather than seeing.
- seen is one short clause naming what in the image made you say this. No speculation.
- date is the date PRINTED ON THE THING, or null if you cannot read one. Never estimate a date from how worn or old something looks, and never use today's date.
- date.value is "YYYY", "YYYY-MM" or "YYYY-MM-DD" — only as precise as what you can actually read.
- date.kind is "manufacture", "expiry", "install", "service" or "purchase".
- date.text is the characters as printed, so a person can check your reading.
- A tyre sidewall's DOT code ends in four digits: week then year. "2319" is week 23 of 2019 — report that as "2019-06", kind "manufacture", and put the raw code in date.text.
- Say nothing about any people in the image; ignore them.
- If nothing in the image is a trackable object, return an empty items array and explain in one sentence in note.

Catalogue (id | name | cycle):
${catalogIndex()}`;

  if (mode === 'date') {
    const entry = subject?.ref ? catalogEntry(subject.ref) : null;
    return `${common}

This photo is meant to show the date printed on one specific thing: ${subject?.name || 'an item'}.${
      entry?.where ? `\nWhere that date normally is: ${entry.where}` : ''
    }
Return at most one item, matching that thing, and concentrate on transcribing the date correctly. If no date is legible, return the item with date null and say why in note.`;
  }

  return `${common}

List every trackable thing you can actually see, most prominent first, at most six. A photo of a whole room may hold several.`;
}

// ---------------------------------------------------------------- reading the reply

const DATE_RE = /^(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?$/;

/**
 * Partial dates round to the START of the period they name. That is the safe direction in
 * both directions this app cares about: an earlier manufacture date expires sooner, and an
 * earlier printed expiry warns sooner. Never round a safety date later than it might be.
 */
function normalizeReadDate(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const m = DATE_RE.exec(String(raw.value ?? '').trim());
  if (!m) return null;
  const year = Number(m[1]);
  if (year < 1950 || year > 2100) return null;
  const month = m[2] ? Math.min(12, Math.max(1, Number(m[2]))) : null;
  const day = m[3] ? Math.min(31, Math.max(1, Number(m[3]))) : null;
  const iso = `${year}-${pad(month ?? 1)}-${pad(day ?? 1)}`;
  if (!isISO(iso)) return null;
  return {
    iso,
    precision: day ? 'day' : month ? 'month' : 'year',
    kind: ['manufacture', 'expiry', 'install', 'service', 'purchase'].includes(raw.kind) ? raw.kind : null,
    text: typeof raw.text === 'string' ? raw.text.slice(0, 60) : '',
    confidence: CONF.includes(raw.confidence) ? raw.confidence : 'low',
  };
}

const CONF = ['high', 'medium', 'low'];

/** Everything the model returns is untrusted shape and untrusted content. Take only what fits. */
function normalizeFindings(raw, limit = 6) {
  const list = Array.isArray(raw) ? raw : Array.isArray(raw?.items) ? raw.items : [];
  const note = typeof raw?.note === 'string' ? raw.note.slice(0, 240) : '';
  const items = [];
  for (const row of list) {
    if (!row || typeof row !== 'object') continue;
    const entry = typeof row.catalogId === 'string' ? catalogEntry(row.catalogId) : null;
    const label = String(row.label ?? entry?.name ?? '').trim().slice(0, 80);
    if (!entry && !label) continue;
    items.push({
      entry,
      label: entry?.name || label,
      given: label,
      confidence: CONF.includes(row.confidence) ? row.confidence : 'low',
      seen: typeof row.seen === 'string' ? row.seen.slice(0, 140) : '',
      date: normalizeReadDate(row.date),
    });
    if (items.length >= limit) break;
  }
  return { items, note };
}

/**
 * Turn a date read off a label into a due date. What the date MEANS decides this: a printed
 * expiry is the due date itself, while a manufacture or service date is the start of a
 * lifespan or a cycle. Getting this backwards would put a 2016 smoke alarm in the "later"
 * pile instead of flagging it as eight years past its useful life.
 */
function dueFromRead(entry, kind, dateISO) {
  if (!isISO(dateISO)) return null;
  if (kind === 'expiry') return dateISO;
  if (!entry) return dateISO;
  if (entry.kind === 'expiry') return entry.life ? addInterval(dateISO, entry.life) : dateISO;
  return entry.every ? addInterval(dateISO, entry.every) : dateISO;
}

// ---------------------------------------------------------------- preparing the file

/**
 * The platform downsizes and strips metadata before anything is sent, so this only steps in
 * when a file is of a type the view will not accept or is over its size cap — a re-encode
 * through a canvas fixes both.
 */
async function prepImage(file, limits) {
  const types = limits?.mediaTypes || [];
  const tooBig = limits?.maxInputBytes ? file.size > limits.maxInputBytes : false;
  const wrongType = types.length ? !types.includes(file.type) : false;
  if (!tooBig && !wrongType) return file;

  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.82));
  if (!blob) throw new Error('That image could not be read. Try a JPEG or PNG.');
  return blob;
}

/** Viewer-facing copy for each way a sample call can fail. */
function sampleErrorCopy(code) {
  switch (code) {
    case 'not_granted':
    case 'sampling_disabled':
    case 'not_declared':
    case 'capability_disabled':
    case 'capability_removed':
      return 'Reading photos is not available on this account. Everything else works as normal.';
    case 'images_unavailable':
      return 'This view cannot send photos. Try opening the page in a browser.';
    case 'image_rejected':
      return 'That file could not be used. A JPEG or PNG photo works best.';
    case 'rate_limited':
      return 'Too many requests just now. Give it a minute and try again.';
    case 'session_expired':
      return 'Your session expired. Sign in again and retry.';
    case 'refused':
      return 'That photo could not be read. Try one showing just the item and its label.';
    case 'invalid_json':
    case 'empty_completion':
      return 'The answer came back unreadable. Try again, or add the item by hand.';
    case 'prompt_too_large':
      return 'That was too much to send at once. Try a single photo.';
    case 'cancelled':
      return '';
    default:
      return 'Something went wrong reading that photo. Try again, or add the item by hand.';
  }
}

// ---------------------------------------------------------------- copy / files

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    /* fall through to the old way, which works in more places */
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch {
    return false;
  }
}

/**
 * Two ways to hand over a file, because neither works everywhere.
 * Self-hosted, a link saves it. On claude.ai the frame cannot, so the host's
 * downloads capability asks the viewer instead — but its allowlist has no .ics,
 * so a calendar file falls back to the copy panel, which always works.
 */
let saver = null;
let asker = null;
let imageLimits = null;

/**
 * Two host abilities, both optional. Saving a file needs either a link (self-hosted) or the
 * host's downloads capability; reading a photo needs the host's sample capability AND a view
 * that can carry images. Both are advertised through data attributes so the CSS can hide the
 * affordances, and the app is fully usable without either.
 */
function initCapabilities() {
  const root = document.documentElement;
  if (!FRAMED) root.dataset.cansave = 'local';

  Promise.resolve()
    .then(() => window.claude?.use?.('downloads'))
    .then((d) => {
      if (!d) return;
      saver = d;
      if (!root.dataset.cansave) root.dataset.cansave = 'hosted';
    })
    .catch(() => {
      /* no save path; the copy panel covers it */
    });

  Promise.resolve()
    .then(() => window.claude?.use?.('sample'))
    .then(async (fn) => {
      if (!fn) return;
      const limits = await fn.limits().catch(() => null);
      if (!limits?.images) return;
      asker = fn;
      imageLimits = limits.images;
      root.dataset.cansee = '1';
      refresh();
    })
    .catch(() => {
      /* photo reading stays hidden */
    });
}

function linkDownload(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function saveFile(name, text, type) {
  if (saver) {
    try {
      await saver.save({ filename: name, data: text });
      return toast('Saved.');
    } catch (err) {
      if (err?.code === 'declined') return;
      if (err?.code === 'rate_limited') return toast('Try that again in a moment.');
      if (!FRAMED) return linkDownload(name, text, type), toast('File saved.');
      return toast('This page cannot hand you a file — copy the text instead.');
    }
  }
  if (!FRAMED) {
    linkDownload(name, text, type);
    return toast('File saved.');
  }
  toast('This page cannot hand you a file — copy the text instead.');
}

function outputPanel(host, { text, label, note, filename, mime, localOnly }) {
  host.hidden = false;
  host.innerHTML = `<div class="field">
      <label class="field-label" for="${host.id}-ta">${esc(label)}</label>
      <textarea id="${host.id}-ta" readonly spellcheck="false">${esc(text)}</textarea>
      ${note ? `<p class="help">${note}</p>` : ''}
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" data-copy="${host.id}-ta" type="button">Copy to clipboard</button>
      <button class="btn btn-sm" ${localOnly ? 'data-save-local' : 'data-save-only'} data-dl="${esc(filename)}" data-mime="${esc(mime)}" data-src="${host.id}-ta" type="button">Save ${esc(filename)}</button>
    </div>`;
}


// ---------------------------------------------------------------- reading a photo

let findings = null;      // the last normalized reply, awaiting confirmation
let photoCtl = null;      // AbortController for the call in flight
let photoURL = null;      // object URL for the preview thumbnail

function releasePhoto() {
  if (photoURL) URL.revokeObjectURL(photoURL);
  photoURL = null;
  photoCtl?.abort();
  photoCtl = null;
  findings = null;
}

const CONF_LABEL = { high: 'confident', medium: 'fairly sure', low: 'a guess' };

function photoStage(html, foot) {
  const stage = $('#photo-stage');
  if (!stage) return;
  stage.innerHTML = html;
  $('#photo-foot').innerHTML = foot;
}

/** Stage one: ask for the photo, and be straight about where it goes. */
function stagePick(mode, item) {
  const accept = (imageLimits?.mediaTypes || ['image/jpeg', 'image/png']).join(',');
  const tip =
    mode === 'date'
      ? hintsFor(item).where || 'Get the printed date filling as much of the frame as you can.'
      : 'One thing up close, or a whole room to find several at once.';
  photoStage(
    `<p class="help" style="margin-top:14px">${esc(tip)}</p>
     <label class="photo-drop" for="photo-file">
       ${svg('camera')}
       <span class="photo-drop-main">Take or choose a photo</span>
       <span class="photo-drop-sub">Fill the frame with the label. Avoid glare.</span>
     </label>
     <input type="file" id="photo-file" class="sr" accept="${esc(accept)}">
     <p class="callout" style="margin-top:16px"><span class="label">Where this photo goes</span>
       This one feature sends your photo to Claude, on your own account, to be read. It is the only
       thing in this app that leaves your browser — your list never does. Nothing is stored there,
       and nothing is added here until you confirm it.</p>`,
    `<button class="btn btn-quiet" type="button" data-act="close">Cancel</button>`
  );
}

function stageBusy() {
  photoStage(
    `<div class="photo-busy">
       ${photoURL ? `<img src="${esc(photoURL)}" alt="The photo you chose">` : ''}
       <p class="photo-status" id="photo-status">Reading the photo…</p>
       <p class="help">Looking for what it is and any date printed on it. This usually takes a few seconds.</p>
     </div>`,
    `<button class="btn btn-quiet" type="button" data-act="photo-stop">Stop</button>`
  );
}

function stageError(msg) {
  photoStage(
    `<div class="notice" data-tone="warn" style="margin-top:16px"><p>${esc(msg)}</p></div>`,
    `<button class="btn btn-quiet" type="button" data-act="close">Close</button>
     <button class="btn" type="button" data-act="photo-again">Try another photo</button>`
  );
}

/** Stage three: everything the model returned, as a proposal to accept, edit or ignore. */
function stageResults(mode, item) {
  const { items, note } = findings;
  if (!items.length) {
    return stageError(
      note || 'Nothing trackable turned up in that photo. Try getting closer, or add the item by hand.'
    );
  }

  const rows = items
    .map((f, i) => {
      const entry = f.entry;
      const cycle = entry
        ? entry.kind === 'interval'
          ? humanizeInterval(entry.every)
          : entry.life
            ? `${entry.life.n}-${entry.life.unit} life`
            : 'expiry date'
        : 'one-off date';
      const due = dueFromRead(entry, f.date?.kind, f.date?.iso);
      const hint = entry?.where;
      return `<div class="found" data-found="${i}">
        <label class="found-head">
          <input type="checkbox" id="found-${i}" ${f.confidence === 'low' ? '' : 'checked'}>
          <span class="found-name">${esc(f.label)}</span>
          <span class="chip" data-state="${f.confidence === 'high' ? 'later' : f.confidence === 'medium' ? 'soon' : 'overdue'}">${esc(CONF_LABEL[f.confidence])}</span>
        </label>
        ${f.seen ? `<p class="found-seen">Saw: ${esc(f.seen)}</p>` : ''}
        <p class="found-cycle">${esc(entry ? `${entry.name} · ${cycle}` : `Not in the catalogue — tracked as “${f.label}”`)}</p>
        ${f.date
          ? `<p class="found-read">Read <b>${esc(f.date.text || f.date.iso)}</b>${
              f.date.kind ? ` as the ${esc(f.date.kind)} date` : ''
            }${f.date.precision !== 'day' ? `, to the nearest ${esc(f.date.precision)}` : ''}.</p>`
          : `<p class="found-read found-none">No date legible.${hint ? ` ${esc(hint)}` : ''}</p>`}
        <div class="field" style="margin-top:8px">
          <label for="found-date-${i}">${esc(f.date?.kind === 'expiry' || entry?.kind === 'expiry' ? 'Expires' : 'Next due')}</label>
          <input type="date" id="found-date-${i}" value="${esc(due || '')}">
        </div>
      </div>`;
    })
    .join('');

  const one = mode === 'date';
  photoStage(
    `<div class="photo-found">
       ${photoURL ? `<img src="${esc(photoURL)}" alt="The photo you chose">` : ''}
       <p class="help">${esc(
         one
           ? 'Check this against the label before you rely on it.'
           : 'Untick anything wrong, fix any date, then add the rest. Check dates against the label before you rely on them.'
       )}</p>
     </div>
     ${rows}
     ${note ? `<p class="help" style="margin-top:12px">${esc(note)}</p>` : ''}`,
    `<button class="btn btn-quiet" type="button" data-act="photo-again">Another photo</button>
     <button class="btn btn-primary" type="button" data-act="photo-apply">${one ? 'Save date' : 'Add ticked'}</button>`
  );
}

function openPhoto(mode, item) {
  releasePhoto();
  openSheet(`<div data-photo="${esc(mode)}"${item ? ` data-target="${esc(item.id)}"` : ''}>
    <div class="sheet-head">
      <div>
        <h3>${mode === 'date' ? 'Read the date' : 'What is this?'}</h3>
        <p class="sub">${esc(mode === 'date' ? item.name : 'Point your camera at a thing or a room')}</p>
      </div>
      <button class="x" type="button" data-act="close" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body"><div id="photo-stage"></div></div>
    <div class="sheet-foot" id="photo-foot"></div>
  </div>`);
  stagePick(mode, item);
}

function photoContext() {
  const holder = sheet().querySelector('[data-photo]');
  if (!holder) return null;
  return { mode: holder.dataset.photo, item: holder.dataset.target ? byId(holder.dataset.target) : null };
}

async function runPhoto(file) {
  const ctx = photoContext();
  if (!ctx || !asker) return;
  const { mode, item } = ctx;

  if (photoURL) URL.revokeObjectURL(photoURL);
  photoURL = URL.createObjectURL(file);
  stageBusy();

  photoCtl = new AbortController();
  try {
    const blob = await prepImage(file, imageLimits);
    const raw = await asker.json(buildPrompt(mode, item), {
      images: blob,
      signal: photoCtl.signal,
      onText: () => {
        const el = $('#photo-status');
        if (el) el.textContent = 'Writing down what it found…';
      },
    });
    findings = normalizeFindings(raw, mode === 'date' ? 1 : 6);
    stageResults(mode, item);
  } catch (err) {
    if (err?.code === 'cancelled') return closeSheet();
    if (err?.code === 'not_granted' || err?.code === 'sampling_disabled') {
      asker = null;
      document.documentElement.removeAttribute('data-cansee');
      refresh();
    }
    stageError(err?.code ? sampleErrorCopy(err.code) : err?.message || sampleErrorCopy('upstream_error'));
  } finally {
    photoCtl = null;
  }
}

/** Nothing the model said reaches the list until it passes through here. */
function applyFindings() {
  const ctx = photoContext();
  if (!ctx || !findings) return;
  const { mode, item } = ctx;

  if (mode === 'date') {
    const val = $('#found-date-0')?.value;
    if (item && isISO(val)) {
      item.due = val;
      item.history = [...item.history, { on: todayISO(), kind: 'renewed', to: val }];
      item.example = false;
      save();
      closeSheet();
      refresh();
      toast(`Date set — ${prettyDate(val)}.`);
    } else {
      closeSheet();
    }
    return;
  }

  let added = 0;
  findings.items.forEach((f, i) => {
    if (!$(`#found-${i}`)?.checked) return;
    const due = $(`#found-date-${i}`)?.value;
    const made = f.entry
      ? fromCatalog(f.entry, { dontKnow: true })
      : makeItem({ name: f.label, kind: 'expiry', cat: 'home', lead: 30 });
    made.due = isISO(due) ? due : null;
    state.items.push(made);
    added += 1;
  });
  save();
  closeSheet();
  if (!added) return toast('Nothing ticked, so nothing added.');
  switchView('due');
  toast(`Added ${added} ${added === 1 ? 'thing' : 'things'} from the photo.`);
}

// ---------------------------------------------------------------- actions

function toast(msg, undoFn) {
  const t = $('#toast');
  undo = undoFn || null;
  t.innerHTML = `<span>${esc(msg)}</span>${undoFn ? '<button class="btn-link" data-act="undo" type="button">Undo</button>' : ''}`;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    t.hidden = true;
    undo = null;
  }, undoFn ? 7000 : 3200);
}

function byId(id) {
  return state.items.find((i) => i.id === id);
}

function refresh() {
  if (view === 'due') renderDue();
  else if (view === 'add') renderAdd();
  else if (view === 'all') renderAll();
  else renderData();
  // The badge is on the Due tab, so it has to be recomputed whichever view is showing.
  if (view !== 'due') {
    const today = todayISO();
    const n = rows(today).filter((r) => !r.item.archived && (r.state === 'overdue' || r.state === 'soon')).length;
    const pip = $('#pip-due');
    pip.textContent = n ? String(n) : '';
    pip.hidden = !n;
  }
}

function markDone(item) {
  const before = { due: item.due, history: [...item.history] };
  const today = todayISO();
  item.due = item.every ? addInterval(today, item.every) : null;
  item.history = [...item.history, { on: today, kind: 'done', to: item.due }];
  item.example = false;
  save();
  closeSheet();
  refresh();
  toast(`Done. Next ${prettyDate(item.due)}.`, () => {
    Object.assign(item, before);
    save();
    refresh();
  });
}

function snooze(item, days) {
  const before = { due: item.due, history: [...item.history] };
  const base = isISO(item.due) ? item.due : todayISO();
  item.due = addDays(base, days);
  item.history = [...item.history, { on: todayISO(), kind: 'snoozed', to: item.due }];
  save();
  closeSheet();
  refresh();
  toast(`Pushed back to ${prettyDate(item.due)}.`, () => {
    Object.assign(item, before);
    save();
    refresh();
  });
}

function renew(item) {
  const hints = hintsFor(item);
  const suggested = hints.life ? addInterval(todayISO(), hints.life) : item.due;
  openSheet(`<form id="renew-form" data-item="${esc(item.id)}">
    <div class="sheet-head">
      <div><h3>${esc(item.name)} renewed</h3><p class="sub">What is the new expiry date?</p></div>
      <button class="x" type="button" data-act="close" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="field"><label for="r-due">New expiry date</label><input type="date" id="r-due" data-autofocus value="${esc(suggested || '')}"></div>
      ${hints.life ? `<p class="help">Suggested from the usual ${hints.life.n}-${hints.life.unit} life. Use the date on the new one if you have it.</p>` : ''}
    </div>
    <div class="sheet-foot">
      <button class="btn btn-quiet" type="button" data-act="close">Cancel</button>
      <button class="btn btn-primary" type="submit">Save date</button>
    </div>
  </form>`);
}

function armOrRun(btn, run) {
  if (btn.dataset.armed === '1') return run();
  btn.dataset.armed = '1';
  btn.dataset.label = btn.textContent;
  btn.textContent = 'Tap again to confirm';
  setTimeout(() => {
    if (btn.isConnected && btn.dataset.armed === '1') {
      btn.dataset.armed = '0';
      btn.textContent = btn.dataset.label;
    }
  }, 4000);
}

function switchView(next) {
  view = next;
  for (const tab of document.querySelectorAll('.tab')) {
    tab.setAttribute('aria-selected', String(tab.dataset.view === next));
  }
  for (const sec of document.querySelectorAll('main > section')) {
    sec.hidden = sec.id !== `view-${next}`;
  }
  refresh();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ---------------------------------------------------------------- wiring

function start() {
  load();
  initCapabilities();
  switchView('due');

  document.addEventListener('click', (e) => {
    const t = e.target;
    const tab = t.closest?.('.tab');
    if (tab) return switchView(tab.dataset.view);

    const act = t.closest?.('[data-act]')?.dataset.act;
    const btn = t.closest?.('[data-act]');

    if (act === 'undo') {
      const fn = undo;
      undo = null;
      $('#toast').hidden = true;
      fn?.();
      return;
    }
    if (act === 'close') return closeSheet();
    if (act === 'photo') return openPhoto('scan');
    if (act === 'photo-again') {
      const ctx = photoContext();
      releasePhoto();
      return stagePick(ctx?.mode || 'scan', ctx?.item);
    }
    if (act === 'photo-stop') return photoCtl?.abort();
    if (act === 'photo-apply') return applyFindings();
    if (act === 'go-add') return switchView('add');
    if (act === 'custom') return openCustom();
    if (act === 'clear-examples') {
      clearExamples();
      refresh();
      return toast('Examples cleared.');
    }

    const pick = t.closest?.('[data-pick]');
    if (pick) {
      const entry = catalogEntry(pick.dataset.pick);
      if (entry) openAdd(entry);
      return;
    }

    const row = t.closest?.('.row');
    if (row) {
      const item = byId(row.dataset.id);
      if (item) openItem(item);
      return;
    }

    const filter = t.closest?.('[data-filter]');
    if (filter) {
      allFilter = filter.dataset.filter;
      renderAll();
      return;
    }

    // ---- sheet actions, scoped to the open item
    const holder = sheet().querySelector('[data-item]');
    const item = holder ? byId(holder.dataset.item) : null;
    if (item) {
      if (act === 'done') return markDone(item);
      if (act === 'snooze') return snooze(item, Number(btn.dataset.days));
      if (act === 'renew') return renew(item);
      if (act === 'photo-date') return openPhoto('date', item);
      if (act === 'archive') {
        item.archived = !item.archived;
        save();
        closeSheet();
        refresh();
        return toast(item.archived ? 'Archived.' : 'Back on the list.');
      }
      if (act === 'delete') {
        return armOrRun(btn, () => {
          const copy = { ...item };
          const at = state.items.indexOf(item);
          state.items.splice(at, 1);
          save();
          closeSheet();
          refresh();
          toast(`Deleted ${copy.name}.`, () => {
            state.items.splice(at, 0, copy);
            save();
            refresh();
          });
        });
      }
    }

    // ---- data tab
    if (act === 'ics') {
      const text = toICS(state.items);
      outputPanel($('#ics-out'), {
        text,
        label: 'Calendar file (.ics)',
        filename: 'lasts.ics',
        mime: 'text/calendar',
        localOnly: true,
        note: FRAMED
          ? 'Copy this, paste it into a plain text file named <code>lasts.ics</code>, then open that file — your calendar app will offer to add the reminders. On a phone, emailing the file to yourself and tapping the attachment is the easiest route. Re-import after you add new things; existing events update rather than duplicate.'
          : 'Open the downloaded file and your calendar app will offer to add the reminders. Re-import after you add new things; existing events update rather than duplicate.',
      });
      return;
    }
    if (act === 'backup') {
      outputPanel($('#backup-out'), {
        text: exportJSON(),
        label: 'Backup (JSON)',
        filename: 'lasts-backup.json',
        mime: 'application/json',
        note: 'Keep this somewhere you will find it again. Pasting it into the restore box on any device brings your list back.',
      });
      return;
    }
    if (act === 'backup-dl') {
      saveFile('lasts-backup.json', exportJSON(), 'application/json');
      return;
    }
    if (act === 'restore') {
      const msg = $('#restore-msg');
      try {
        const n = importJSON($('#restore-in').value);
        refresh();
        toast(`Restored ${n} ${n === 1 ? 'item' : 'items'}.`);
      } catch (err) {
        msg.textContent = err.message || 'That backup could not be read.';
        msg.style.color = 'var(--alarm)';
      }
      return;
    }
    if (act === 'wipe') {
      return armOrRun(btn, () => {
        wipe();
        refresh();
        toast('Everything deleted.');
      });
    }

    const copyBtn = t.closest?.('[data-copy]');
    if (copyBtn) {
      const ta = document.getElementById(copyBtn.dataset.copy);
      copyText(ta.value).then((ok) => {
        if (ok) return toast('Copied.');
        ta.focus();
        ta.select();
        toast('Selected — press Ctrl+C or ⌘C to copy.');
      });
      return;
    }
    const dlBtn = t.closest?.('[data-dl]');
    if (dlBtn) {
      saveFile(dlBtn.dataset.dl, document.getElementById(dlBtn.dataset.src).value, dlBtn.dataset.mime);
      return;
    }

    const quick = t.closest?.('[data-quick]')?.dataset.quick;
    if (quick) {
      const input = $('#add-date');
      if (quick === 'today') input.value = todayISO();
      if (quick === 'month') input.value = addDays(todayISO(), -30);
      if (quick === 'unknown') {
        input.value = '';
        toast('Saved without a date — it will sit under “Needs a date”.');
      }
      return;
    }
  });

  // ---- searches
  document.addEventListener('input', (e) => {
    if (e.target.id === 'add-search') {
      addQuery = e.target.value;
      const at = e.target.selectionStart;
      renderAdd();
      const again = $('#add-search');
      again.focus();
      again.setSelectionRange(at, at);
    }
    if (e.target.id === 'all-search') {
      allQuery = e.target.value;
      const at = e.target.selectionStart;
      renderAll();
      const again = $('#all-search');
      again.focus();
      again.setSelectionRange(at, at);
    }
    if (e.target.id === 'c-kind') {
      $('#c-every-wrap').hidden = e.target.value === 'expiry';
    }
  });

  // ---- live editing in the item sheet
  document.addEventListener('change', (e) => {
    if (e.target.id === 'photo-file') {
      const file = e.target.files?.[0];
      if (file) runPhoto(file);
      return;
    }
    const holder = sheet().querySelector('[data-item]');
    if (!holder || !sheet().open) return;
    const item = byId(holder.dataset.item);
    if (!item) return;
    const id = e.target.id;
    const map = {
      'i-due': () => (item.due = isISO(e.target.value) ? e.target.value : null),
      'i-lead': () => (item.lead = Number(e.target.value)),
      'i-name': () => (item.name = e.target.value.trim() || item.name),
      'i-where': () => (item.where = e.target.value.trim()),
      'i-note': () => (item.note = e.target.value.trim()),
      'i-n': () => (item.every = { n: Math.max(1, Number($('#i-n').value) || 1), unit: $('#i-u').value }),
      'i-u': () => (item.every = { n: Math.max(1, Number($('#i-n').value) || 1), unit: $('#i-u').value }),
    };
    if (!map[id]) return;
    map[id]();
    item.example = false;
    save();
    refresh();
    const sub = sheet().querySelector('.sheet-head .sub');
    if (sub) {
      const st = statusOf(item, todayISO());
      sub.textContent =
        st.state === 'nodate' ? 'No date yet' : `${item.kind === 'expiry' ? 'Expires' : 'Due'} ${prettyDate(item.due)} · ${relativeDays(st.days)}`;
    }
  });

  // ---- form submits
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;

    if (form.id === 'add-form') {
      const entry = catalogEntry(form.dataset.ref);
      const date = $('#add-date').value;
      const every = entry.kind === 'interval' ? { n: Math.max(1, Number($('#add-n').value) || 1), unit: $('#add-u').value } : null;
      const item = fromCatalog(entry, {
        date,
        dontKnow: !isISO(date),
        where: $('#add-where').value.trim(),
        every,
        lead: Number($('#add-lead').value),
      });
      state.items.push(item);
      save();
      closeSheet();
      switchView('due');
      const st = statusOf(item, todayISO());
      toast(
        st.state === 'nodate'
          ? `${item.name} added — go and find the date.`
          : `${item.name} added · ${item.kind === 'expiry' ? 'expires' : 'due'} ${prettyDate(item.due)}.`
      );
      return;
    }

    if (form.id === 'custom-form') {
      const kind = $('#c-kind').value;
      const due = $('#c-due').value;
      const item = makeItem({
        name: $('#c-name').value.trim() || 'Untitled',
        where: $('#c-where').value.trim(),
        cat: $('#c-cat').value,
        kind,
        due: isISO(due) ? due : null,
        every: kind === 'interval' ? { n: Math.max(1, Number($('#c-n').value) || 1), unit: $('#c-u').value } : null,
        lead: Number($('#c-lead').value),
        note: $('#c-note').value.trim(),
      });
      state.items.push(item);
      save();
      closeSheet();
      switchView('due');
      toast(`${item.name} added.`);
      return;
    }

    if (form.id === 'renew-form') {
      const item = byId(form.dataset.item);
      const val = $('#r-due').value;
      if (item && isISO(val)) {
        item.due = val;
        item.history = [...item.history, { on: todayISO(), kind: 'renewed', to: val }];
        item.example = false;
        save();
        closeSheet();
        refresh();
        toast(`Renewed — expires ${prettyDate(val)}.`);
      }
      return;
    }
  });

  // Clicking the backdrop of a sheet closes it, the way a bottom sheet should.
  sheet().addEventListener('click', (e) => {
    if (e.target === sheet()) closeSheet();
  });

  // Emptying it on close means a stale data-item can never catch a later click.
  sheet().addEventListener('close', () => {
    releasePhoto();
    sheet().innerHTML = '';
  });
}

start();
</script>
