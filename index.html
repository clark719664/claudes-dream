<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prism Break</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Prism Break — fit the shape, fill the line, collect the album."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <!-- iOS ignores the manifest for these, so they are declared separately. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
  </head>
  <body>
    <div id="app">
      <header id="hud" hidden>
        <div class="hud-stat"><span class="hud-label">Score</span><b id="hud-score">0</b></div>
        <div class="hud-stat"><span class="hud-label">Moves</span><b id="hud-shots">0</b></div>
        <div class="hud-goal">
          <span class="txt"><b id="hud-goal-count">0</b> <span id="hud-goal-text">Goal</span></span>
          <div class="bar"><i id="hud-goal-bar" style="width:0%;background:var(--accent)"></i></div>
        </div>
        <button id="hud-pause" class="icon-btn" aria-label="Pause">❚❚</button>
      </header>
      <canvas id="stage"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
