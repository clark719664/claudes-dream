<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prism Break</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Prism Break — chain colours, collapse the wall, collect the album."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔷</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="hud" hidden>
        <div class="hud-stat"><span class="hud-label">Score</span><b id="hud-score">0</b></div>
        <div class="hud-stat"><span class="hud-label">Wave</span><b id="hud-wave">1</b></div>
        <div class="hud-stat"><span class="hud-label">Shards</span><b id="hud-shards">0</b></div>
        <button id="hud-pause" class="icon-btn" aria-label="Pause">❚❚</button>
      </header>
      <canvas id="stage"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
