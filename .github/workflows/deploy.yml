# Publishes the game to GitHub Pages on every push, so there is a real URL to
# install from a phone home screen.
#
# NOTE: GitHub Pages on a *private* repository needs a paid plan (Pro, Team or
# Enterprise). On a free account this workflow will fail until the repo is made
# public — or use Netlify, Vercel or Cloudflare Pages, all of which serve a
# private repo on their free tier. See docs/SETUP.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/viral-mobile-game-collectibles-i538fb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
